{% extends "base.html" %}
{% block title %}新しいパスワードの設定 | REVISION{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[70vh]">
  <div class="w-full max-w-sm">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
      <h2 class="text-lg font-semibold text-gray-700 mb-4">新しいパスワードの設定</h2>

      <form id="reset-form" class="space-y-4">
        <input type="hidden" name="token" value="{{ token }}" />
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">新しいパスワード</label>
          <input type="password" name="password" id="password"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500"
            placeholder="8文字以上" minlength="8" required />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">パスワード（確認）</label>
          <input type="password" id="password-confirm"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500"
            placeholder="••••••••" required />
        </div>
        <div id="reset-msg" class="hidden text-sm"></div>
        <button type="submit"
          class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg transition">
          パスワードを変更する
        </button>
      </form>
    </div>
  </div>
</div>

<script>
document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msgEl = document.getElementById('reset-msg');
  const pw = document.getElementById('password').value;
  const pwc = document.getElementById('password-confirm').value;

  if (pw !== pwc) {
    msgEl.textContent = 'パスワードが一致しません';
    msgEl.className = 'text-red-600 text-sm';
    msgEl.classList.remove('hidden');
    return;
  }

  const res = await fetch('/api/auth/reset-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: e.target.token.value, password: pw }),
  });

  if (res.ok) {
    msgEl.textContent = 'パスワードを変更しました。ログインページへ移動します...';
    msgEl.className = 'text-green-700 text-sm';
    msgEl.classList.remove('hidden');
    setTimeout(() => window.location.href = '/auth/login', 2000);
  } else {
    const data = await res.json().catch(() => ({}));
    msgEl.textContent = data.detail || 'リセットリンクが無効または期限切れです';
    msgEl.className = 'text-red-600 text-sm';
    msgEl.classList.remove('hidden');
  }
});
</script>
{% endblock %}
