{% extends "base.html" %}
{% block title %}ログイン | REVISION{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[70vh]">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-6xl mb-2">⚽</div>
      <h1 class="text-2xl font-bold text-gray-800">REVISION</h1>
      <p class="text-gray-500 text-sm mt-1">チームの活動管理</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
      <h2 class="text-lg font-semibold text-gray-700 mb-4">ログイン</h2>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">メールアドレス</label>
          <input type="email" id="email" name="username"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
            placeholder="email@example.com" autocomplete="email" required />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">パスワード</label>
          <input type="password" id="password" name="password"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
            placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <div id="login-error" class="hidden text-red-600 text-sm"></div>
        <button type="submit"
          class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg transition">
          ログイン
        </button>
      </form>

      <div class="mt-4 flex flex-col gap-2 text-sm text-center">
        <a href="/auth/forgot-password" class="text-green-600 hover:underline">パスワードを忘れた方</a>
        <a href="/auth/register" class="text-gray-500 hover:underline">アカウント登録はこちら</a>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('login-error');
  errEl.classList.add('hidden');

  const formData = new FormData(e.target);
  const res = await fetch('/api/auth/jwt/login', { method: 'POST', body: formData });

  if (res.ok) {
    window.location.href = '/events';
  } else {
    const data = await res.json().catch(() => ({}));
    errEl.textContent = data.detail || 'メールアドレスまたはパスワードが正しくありません';
    errEl.classList.remove('hidden');
  }
});
</script>
{% endblock %}
