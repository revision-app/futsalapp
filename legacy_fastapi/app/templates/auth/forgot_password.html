{% extends "base.html" %}
{% block title %}パスワードリセット | REVISION{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[70vh]">
  <div class="w-full max-w-sm">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
      <h2 class="text-lg font-semibold text-gray-700 mb-1">パスワードをお忘れの方</h2>
      <p class="text-sm text-gray-500 mb-4">登録済みのメールアドレスを入力してください。リセット用リンクを送信します。</p>

      <form id="forgot-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">メールアドレス</label>
          <input type="email" name="email"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500"
            placeholder="email@example.com" required />
        </div>
        <div id="forgot-msg" class="hidden text-sm"></div>
        <button type="submit"
          class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg transition">
          リセットリンクを送信
        </button>
      </form>
      <div class="mt-4 text-sm text-center">
        <a href="/auth/login" class="text-gray-500 hover:underline">← ログインに戻る</a>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('forgot-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msgEl = document.getElementById('forgot-msg');
  const email = e.target.email.value;

  await fetch('/api/auth/forgot-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email }),
  });

  // セキュリティのため成功/失敗問わず同じメッセージを表示
  msgEl.textContent = 'メールを送信しました。受信トレイをご確認ください。';
  msgEl.className = 'text-green-700 text-sm';
  msgEl.classList.remove('hidden');
  e.target.querySelector('button').disabled = true;
});
</script>
{% endblock %}
